---
- name: IBM i Sysadmin & Database Automation Demo
  hosts: all
  gather_facts: false

  vars:
    demo_library: "DEMOLIB"

  tasks:

    # -------------------------------------------------------------------
    # STAGE 1: SYSTEM HEALTH & CL COMMANDS
    # -------------------------------------------------------------------
    - name: "Stage 1: Gather IBM i Facts"
      ibm.power_ibmi.ibmi_facts:
      register: ibmi_facts_out

    - name: "Stage 1: Display IBM i Version"
      ansible.builtin.debug:
        var: ibmi_facts_out

    - name: "Stage 1: Check System Status (CL Command)"
      ibm.power_ibmi.ibmi_cl_command:
        cmd: "WRKSYSSTS"
      register: syssts_out

    # -------------------------------------------------------------------
    # STAGE 2: DATABASE CREATION & INGESTION
    # -------------------------------------------------------------------
    - name: "Stage 2: Create Target Schema (Auto-creates Library and Journaling)"
      ibm.power_ibmi.ibmi_sql_execute:
        sql: "CREATE SCHEMA {{ demo_library }}"
      register: create_schema_out
      failed_when:
        - create_schema_out.rc != 0
        # Fail ONLY IF error is NOT 'SQL0601' (Schema already exists)
        - "'SQL0601' not in (create_schema_out.job_log | default([]) | map(attribute='MESSAGE_ID') | list)"

    - name: "Stage 2: Create SQL Table inside DB2"
      ibm.power_ibmi.ibmi_sql_execute:
        sql: |
          CREATE TABLE {{ demo_library }}.CUSTOMERS (
            CUST_ID INT PRIMARY KEY,
            CUST_NAME VARCHAR(50),
            STATUS VARCHAR(20),
            CREATED_AT TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          )
      register: create_table_out
      failed_when:
        - create_table_out.rc != 0
        # Ignore failure if the table already exists (SQL0601)
        - "'SQL0601' not in (create_table_out.job_log | default([]) | map(attribute='MESSAGE_ID') | list)"
        
    - name: "Stage 2: Populate Data (Idempotent Insert with No Commit)"
      ibm.power_ibmi.ibmi_sql_execute:
        sql: |
          INSERT INTO {{ demo_library }}.CUSTOMERS (CUST_ID, CUST_NAME, STATUS)
          SELECT * FROM (
            VALUES 
              (101, 'Acme Corp', 'ACTIVE'),
              (102, 'Globex Inc', 'PENDING'),
              (103, 'Initech', 'ACTIVE')
          ) AS src(CUST_ID, CUST_NAME, STATUS)
          WHERE NOT EXISTS (
            SELECT 1 FROM {{ demo_library }}.CUSTOMERS WHERE CUST_ID = src.CUST_ID
          ) WITH NC
      register: populate_out
      failed_when:
        - populate_out.rc != 0
        # Ignore failure if 0 rows were inserted due to existing records (SQLSTATE 02000 / SQLCODE 100)
        - "'02000' not in populate_out.stderr"

    # -------------------------------------------------------------------
    # STAGE 3: BATCH JOB PROCESSING
    # -------------------------------------------------------------------

    - name: "Stage 3: Submit a Batch Job to QBATCH Queue (Simulating 10s processing job)"
      ibm.power_ibmi.ibmi_submit_job:
        cmd: "DLYJOB DLY(10)"
        parameters: "JOB(AAP_MOCK) JOBQ(QBATCH)"
        status: ['*COMPLETE']
        time_out: '60s'
        check_interval: '5s'  # Polls every 5s instead of 1 minute
      register: batch_result

    - name: "Stage 3: Display Batch Job Status"
      ansible.builtin.debug:
        msg: "Batch Job Completed with Job ID: {{ batch_result.job_id }}"

    # -------------------------------------------------------------------
    # STAGE 4: QUERY & REPORTING
    # -------------------------------------------------------------------
    - name: "Stage 4: Query Database Table"
      ibm.power_ibmi.ibmi_sql_query:
        sql: "SELECT CUST_ID, CUST_NAME, STATUS FROM {{ demo_library }}.CUSTOMERS WHERE STATUS = 'ACTIVE'"
      register: db_query_out

    - name: "Stage 4: Print Active Customers from IBM i DB2"
      ansible.builtin.debug:
        var: db_query_out.row

    # -------------------------------------------------------------------
    # STAGE 5: CLEANUP (OPTIONAL)
    # -------------------------------------------------------------------
    - name: "Stage 5: Delete Demo Schema & Library (Cleanup)"
      ibm.power_ibmi.ibmi_sql_execute:
        sql: "DROP SCHEMA {{ demo_library }} CASCADE"
      register: drop_schema_out
      when: clean_up | default(false) | bool
      failed_when:
        - drop_schema_out.rc != 0
        # Ignore error if schema does not exist when cleaning up
        - "'SQL0204' not in (drop_schema_out.job_log | default([]) | map(attribute='MESSAGE_ID') | list)"
